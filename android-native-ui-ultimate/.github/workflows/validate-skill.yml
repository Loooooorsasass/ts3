name: Validate skill package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/run_checks.sh
      - run: bash scripts/package_skill.sh